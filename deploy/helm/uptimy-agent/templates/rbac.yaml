{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "uptimy-agent.serviceAccountName" . }}
  labels: {{- include "uptimy-agent.labels" . | nindent 4 }}
{{- end }}
{{- if .Values.rbac.create }}
{{- $kind := ternary "ClusterRole" "Role" .Values.rbac.clusterWide }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ $kind }}
metadata:
  name: {{ include "uptimy-agent.fullname" . }}
  labels: {{- include "uptimy-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get"{{ if .Values.discovery.enabled }}, "list"{{ end }}]
  # kubernetes checks on a Service count its ready endpoints.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get"{{ if .Values.discovery.enabled }}, "list"{{ end }}]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list"]
  {{- if .Values.discovery.enabled }}
  # Discovery lists only objects labeled upti.my/monitor=true, and the pods
  # behind a discovered Service to find their readinessProbe path.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  # CronJob heartbeats read their runs from the CronJob's Jobs.
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["list"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["list"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ $kind }}Binding
metadata:
  name: {{ include "uptimy-agent.fullname" . }}
  labels: {{- include "uptimy-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ $kind }}
  name: {{ include "uptimy-agent.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "uptimy-agent.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
