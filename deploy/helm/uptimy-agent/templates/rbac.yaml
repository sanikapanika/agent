{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "uptimy-agent.serviceAccountName" . }}
  labels: {{- include "uptimy-agent.labels" . | nindent 4 }}
{{- end }}
{{- if .Values.rbac.create }}
{{- $kind := ternary "ClusterRole" "Role" .Values.rbac.clusterWide }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ $kind }}
metadata:
  name: {{ include "uptimy-agent.fullname" . }}
  labels: {{- include "uptimy-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ $kind }}Binding
metadata:
  name: {{ include "uptimy-agent.fullname" . }}
  labels: {{- include "uptimy-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ $kind }}
  name: {{ include "uptimy-agent.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "uptimy-agent.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
