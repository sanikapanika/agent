name: Artifact Hub metadata

# Pushes deploy/helm/artifacthub-repo.yml as the chart's `artifacthub.io`
# tag, which Artifact Hub reads for ownership and the verified publisher
# badge. It only changes when that file does.
on:
  push:
    branches: [main]
    paths: [deploy/helm/artifacthub-repo.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  push:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: deploy/helm
    steps:
      - uses: actions/checkout@v7
      - uses: oras-project/setup-oras@v2
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: |
          oras push ghcr.io/uptimy/charts/uptimy-agent:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
